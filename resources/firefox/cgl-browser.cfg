// Cool Games Launcher local browser integration. AutoConfig requires this first comment.
// Enable bridge diagnostics only for explicit local debug runs.
(() => {
  try {
  const Services = globalThis.Services;
  if (!Services) throw Error('Services unavailable');
  const personal=globalThis.__CGL_PERSONAL;
  const configPath = personal ? '' : Services.env.get('CGL_BROWSER_CONTROL');
  if (Services.env.get('CGL_DEBUG')) Services.prefs.setBoolPref('browser.dom.window.dump.enabled',true);
  if (!configPath && !personal) return; // The existing WebDriver mode remains independent.
  if(!personal)Services.prefs.setBoolPref('cgl.browser.userControl',false);
  let startBrowser;
  const hideStartupWindow=win=>{
    if(Services.prefs.getBoolPref('cgl.browser.userControl',false))return;
    try{win.docShell.treeOwner.QueryInterface(Ci.nsIBaseWindow).visibility=false;}catch{}
  };
  if(!personal)Services.ww.registerNotification({observe(win,topic){
    if(topic!=='domwindowopened')return;
    hideStartupWindow(win);
    win.addEventListener('DOMContentLoaded',()=>{
      if(win.document.documentURI==='chrome://browser/content/browser.xhtml')hideStartupWindow(win);
    },{once:true});
    win.addEventListener('load',()=>{if(win.document.documentURI==='chrome://browser/content/browser.xhtml')startBrowser?.();},{once:true});
  }});
  Cu.importGlobalProperties(['IOUtils','fetch']);
  const {setTimeout,clearTimeout,setInterval,clearInterval}=ChromeUtils.importESModule('resource://gre/modules/Timer.sys.mjs');
  const start = async () => {
    const config = personal?.config ?? await IOUtils.readJSON(configPath);
    const profile = Services.dirsvc.get('ProfD', Ci.nsIFile).path;
    if (config.profile !== profile || !Number.isInteger(config.port) || !/^[a-f0-9]{64}$/.test(config.token)) throw Error('Invalid launcher control configuration');
    const dir = personal ? Services.dirsvc.get('ProfD', Ci.nsIFile) : Services.dirsvc.get('GreD', Ci.nsIFile);
    if(personal)dir.initWithPath(personal.resourceDir);else dir.append('cgl-browser');
    const resourceName=personal?'cgl-browser-'+config.token.slice(0,12):'cgl-browser';
    const actorName=personal?'CglPersonalBrowser':'CglBrowser';
    Services.io.getProtocolHandler('resource').QueryInterface(Ci.nsIResProtocolHandler).setSubstitution(resourceName, Services.io.newFileURI(dir));
    // Content-only actor: no parent receiveMessage handler or privileged browser
    // capability is exposed to a compromised web process (Firefox 154+ opt-in).
    const childModule='resource://'+resourceName+'/CglBrowserChild.sys.mjs';
    ChromeUtils.registerWindowActor(actorName, {child: {esModuleURI: childModule}, allFrames: true, includeChrome: false, safeForUntrustedWebProcess:true, remoteTypes:['web','webIsolated','webCOOP+COEP','privilegedabout'], matches: ['http://*/*', 'https://*/*', 'about:blank', 'about:newtab']});
    let SessionStore;
    try{({SessionStore}=ChromeUtils.importESModule('moz-src:///browser/components/sessionstore/SessionStore.sys.mjs'));}
    catch{({SessionStore}=ChromeUtils.importESModule('resource:///modules/sessionstore/SessionStore.sys.mjs'));}
    let startupObserver=null;
    const kickedStartup=new WeakSet();
    const kickStartup=win=>{if(win.closed||kickedStartup.has(win))return;if(win.gBrowserInit?._loadHandled){kickedStartup.add(win);if(!win.gBrowserInit.delayedStartupFinished)win.gBrowserInit._delayedStartup();}else setTimeout(()=>kickStartup(win),25);};
    const hideWindow=win=>{try{win.docShell.treeOwner.QueryInterface(Ci.nsIBaseWindow).visibility=false}catch{}};
    if(personal&&config.hideStartupWindows){
      // These windows were created by this launcher-started Firefox process.
      // Keep their restored personal tabs intact, behind the launcher window.
      startupObserver={observe(win,topic){if(topic!=='domwindowopened')return;hideWindow(win);win.addEventListener('DOMContentLoaded',()=>hideWindow(win),{once:true});kickStartup(win);}};
      Services.ww.registerNotification(startupObserver);
      for(const w of Services.wm.getEnumerator('navigator:browser')){hideWindow(w);kickStartup(w);}
    }
    await SessionStore.promiseAllWindowsRestored;
    if(startupObserver){for(const w of Services.wm.getEnumerator('navigator:browser'))hideWindow(w);Services.ww.unregisterNotification(startupObserver);}

    const ownedWindows=new Set(),ownedContexts=new Set();
    const trackOwnedWindow=win=>{
      ownedWindows.add(win);win.__cglOwnedBrowser=true;
      const remember=tab=>{try{ownedContexts.add(tab.linkedBrowser.browsingContext.id)}catch{}};
      const ready=()=>{if(!win.gBrowser)return;for(const tab of win.gBrowser.tabs)remember(tab);win.gBrowser.tabContainer.addEventListener('TabOpen',e=>remember(e.target));};
      if(win.gBrowser)ready();else win.addEventListener('DOMContentLoaded',ready,{once:true});
    };
    if(personal){
      const parent=Services.wm.getMostRecentWindow('navigator:browser');
      const own=parent.openDialog('chrome://browser/content/browser.xhtml','_blank','chrome,dialog=no,all,suppressanimation,width='+config.width+',height='+config.height,'about:blank');
      trackOwnedWindow(own);
      const hide=()=>{try{own.docShell.treeOwner.QueryInterface(Ci.nsIBaseWindow).visibility=false}catch{}};
      hide();own.addEventListener('DOMContentLoaded',hide,{once:true});
      let startedOwn=false;
      while(!own.gBrowserInit?.delayedStartupFinished){if(own.closed)throw Error('Launcher Firefox window was closed');if(!startedOwn&&own.gBrowserInit?._loadHandled&&typeof own.gBrowserInit._delayedStartup==='function'){startedOwn=true;own.gBrowserInit._delayedStartup();}await new Promise(r=>setTimeout(r,25));}
      own.resizeTo(config.width??1440,config.height??1000);
      own.document.documentElement.setAttribute('titlepreface','Cool Games Launcher · ');
      own.gBrowser.updateTitlebar?.();
      hide();
    }
    let shownWindow=null;
    const popupObserver=personal?{observe(win,topic){if(topic!=='domwindowopened')return;const adopt=()=>{try{const opener=win.opener?.browsingContext?.top?.embedderElement?.ownerGlobal??win.opener;if(!ownedWindows.has(opener))return;trackOwnedWindow(win);if(!shownWindow)hideWindow(win)}catch{}};adopt();win.addEventListener('DOMContentLoaded',adopt,{once:true});}}:null;
    if(popupObserver)Services.ww.registerNotification(popupObserver);
    const tabs = new WeakMap(), chromeSandboxes = new WeakMap(); let nextTab = 0;
    const entries = () => [...Services.wm.getEnumerator('navigator:browser')].filter(win=>!personal||ownedWindows.has(win)).flatMap(win => [...win.gBrowser.tabs].map(tab => {
      if(personal)ownedContexts.add(tab.linkedBrowser.browsingContext.id);
      if (!tabs.has(tab)) tabs.set(tab, String(++nextTab));
      return {win, tab, browser:tab.linkedBrowser, id:tabs.get(tab)};
    }));
    const selected = () => {const list=entries();const selectedWindow=shownWindow&&!shownWindow.closed?shownWindow:Services.wm.getMostRecentWindow('navigator:browser');return list.find(e=>e.win===selectedWindow&&e.tab===e.win.gBrowser.selectedTab)||list[0];};
    const lookup = id => entries().find(e => e.id === id) || (()=>{throw Error('Browser tab was closed');})();
    const selectTab=(win,tab)=>{
      win.gBrowser.selectedTab=tab;
      if(win.gBrowser.selectedTab!==tab)throw Error('Firefox needs your attention before it can switch tabs.');
    };
    let current = selected().id;
    const content = async (entry, data) => {
      for (let n=0;n<40;n++) {
        try { return await entry.browser.browsingContext.currentWindowGlobal.getActor(actorName).sendQuery('command',data); }
        catch (error) { if (!/not available|No such|actor.*not found|NotSupported|destroyed|Actor.*not|not initialized/i.test(String(error)) || n===39) throw error; await new Promise(r=>setTimeout(r,50)); }
      }
    };
    let paintTimer=null,painting=false,lastUse=0;
    const keepPainting=()=>{
      lastUse=Date.now();if(paintTimer||shownWindow)return;
      paintTimer=setInterval(async()=>{
        if(shownWindow||Date.now()-lastUse>2500){clearInterval(paintTimer);paintTimer=null;return;}
        if(painting)return;painting=true;
        try{await content(lookup(current),{op:'frame'})}catch{}finally{painting=false;}
      },50);
    };
    let quitting=false;
    const execute = async p => {
      // File hosts may close their own tab immediately after starting a
      // download. Keep chrome queries usable so its transfer can be adopted.
      if(!entries().some(e=>e.id===current))current=selected()?.id;
      if(!['visibility','quit'].includes(p.op))keepPainting();
      if(Services.env.get('CGL_DEBUG'))dump('[cgl-normal] command '+p.op+' '+(p.context||'')+'\n');
      if (p.op === 'handles') return entries().map(e=>e.id);
      if (p.op === 'selected') return selected().id;
      if (p.op === 'dialog') return lookup(current).win.document.documentElement.hasAttribute('window-modal-open');
      if (p.op === 'selectedUrl') return selected().browser.currentURI.spec;
      if (p.op === 'visibility') {
        if(!personal)Services.prefs.setBoolPref('cgl.browser.userControl',p.visible);
        shownWindow=p.visible?lookup(current).win:null;
        for(const w of new Set(entries().map(e=>e.win)))w.docShell.treeOwner.QueryInterface(Ci.nsIBaseWindow).visibility=!!p.visible&&w===shownWindow;
        if(shownWindow)shownWindow.focus();
        return null;
      }
      if (p.op === 'selectedScript') return content(selected(),{op:'script',source:p.source,args:[]});
      if (p.op === 'newTab') {const win=lookup(current).win;const tab=win.gBrowser.addTab('about:blank',{triggeringPrincipal:Services.scriptSecurityManager.getSystemPrincipal()});selectTab(win,tab);current=entries().find(e=>e.tab===tab).id;return current;}
      if (p.op === 'switch') {const e=lookup(p.handle);selectTab(e.win,e.tab);current=e.id;return null;}
      if (p.op === 'quit') {if(personal)quitting=true;else setTimeout(()=>Services.startup.quit(Ci.nsIAppStartup.eForceQuit),100);return null;}
      const e=lookup(current), win=e.win;
      if (p.op === 'url') return e.browser.currentURI.spec;
      if (p.op === 'state') return {url:e.browser.currentURI.spec,loading:e.browser.webProgress.isLoadingDocument,document:e.browser.browsingContext.currentWindowGlobal?.innerWindowId};
      if (p.op === 'title') return e.browser.contentTitle;
      if (p.op === 'close') {win.gBrowser.removeTab(e.tab,{animate:false});current=selected()?.id;return null;}
      if (p.op === 'maximize') {win.maximize();return null;}
      if (p.op === 'load') {e.browser.loadURI(Services.io.newURI(p.url),{triggeringPrincipal:Services.scriptSecurityManager.getSystemPrincipal()});return null;}
      if (p.op === 'history') {if(p.action==='back'&&e.browser.canGoBack)e.browser.goBack();else if(p.action==='forward'&&e.browser.canGoForward)e.browser.goForward();else if(p.action==='reload')e.browser.reload();else return false;return true;}
      if (p.op === 'script' && p.context === 'chrome') {
        let sandbox=chromeSandboxes.get(win);
        if(!sandbox){sandbox=Cu.Sandbox(Services.scriptSecurityManager.getSystemPrincipal(),{sandboxPrototype:win,wantXrays:false});Object.assign(sandbox,{Services,ChromeUtils,Ci,Cu,cglOwnsDownload:dl=>{if(!personal||ownedContexts.has(dl.source.browsingContextId))return true;try{return ownedContexts.has(win.BrowsingContext.get(dl.source.browsingContextId)?.top?.id)}catch{return false}}});chromeSandboxes.set(win,sandbox);}
        const args=p.args||[];
        try {
          if (p.async) return await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('Browser script timed out')),p.timeout||15000);sandbox.__cglArgs=[...args,v=>{clearTimeout(timer);resolve(v)}];try{Cu.evalInSandbox(`(function(){${p.source}\n}).apply(window,__cglArgs)`,sandbox);}catch(error){clearTimeout(timer);reject(error);}});
          sandbox.__cglArgs=args;
          return await Cu.evalInSandbox(`(function(){${p.source}\n}).apply(window,__cglArgs)`,sandbox);
        } finally {delete sandbox.__cglArgs;}
      }
      if (p.op === 'screenshot') {
        const info=await content(e,{op:'viewport'});
        // A null rect captures the actual viewport, including fixed overlays.
        // Document rectangles showed the AI the page top after scrolling.
        const bitmap=await e.browser.browsingContext.currentWindowGlobal.drawSnapshot(null,info.dpr,'rgb(255,255,255)');
        const canvas=win.document.createElementNS('http://www.w3.org/1999/xhtml','canvas');canvas.width=bitmap.width;canvas.height=bitmap.height;
        canvas.getContext('2d').drawImage(bitmap,0,0);bitmap.close();return canvas.toDataURL('image/png').split(',')[1];
      }
      return content(e,p);
    };
    const headers={'Authorization':'Bearer '+config.token,'Content-Type':'application/json'};
    const endpoint='http://127.0.0.1:'+config.port;
    await fetch(endpoint+'/ready',{method:'POST',headers,body:'{}'});
    // No listener or control API is exposed to website documents. Firefox polls
    // an authenticated loopback endpoint owned by this one launcher worker.
    try {for (;;) {
      const response=await fetch(endpoint+'/poll',{headers});
      if (!response.ok) break;
      const request=await response.json();if(!request)continue;
      let result;
      try {result={id:request.id,value:await execute(request.command)};}
      catch(error){result={id:request.id,error:String(error?.message||error)};}
      if(Services.env.get('CGL_DEBUG'))dump('[cgl-normal] result '+request.id+' '+(result.error||typeof result.value)+'\n');
      await fetch(endpoint+'/result',{method:'POST',headers,body:JSON.stringify(result)});
      if(quitting)break;
    }} finally {if(paintTimer)clearInterval(paintTimer);if(personal){if(popupObserver)Services.ww.unregisterNotification(popupObserver);for(const w of ownedWindows)if(!w.closed)w.close();ChromeUtils.unregisterWindowActor(actorName);Services.io.getProtocolHandler('resource').QueryInterface(Ci.nsIResProtocolHandler).setSubstitution(resourceName,null);}}
  };
  if(personal){start().catch(async error=>{dump('[cgl-normal] '+String(error)+'\n');try{const c=personal.config;await fetch('http://127.0.0.1:'+c.port+'/ready',{method:'POST',headers:{'Authorization':'Bearer '+c.token,'Content-Type':'application/json'},body:JSON.stringify({error:String(error?.message||error)})})}catch{}});return;}
  let started=false;
  startBrowser=()=>{if(started)return;const win=Services.wm.getMostRecentWindow('navigator:browser');if(!win?.gBrowser?.selectedBrowser||!win.gBrowserInit?._loadHandled){setTimeout(startBrowser,20);return;}started=true;if(!win.gBrowserInit.delayedStartupFinished&&typeof win.gBrowserInit._delayedStartup==='function')win.gBrowserInit._delayedStartup();start().catch(error=>dump('[cgl-normal] '+String(error)+'\n'));};
  const observer={observe(win){Services.obs.removeObserver(observer,'browser-delayed-startup-finished');startBrowser();}};
  Services.obs.addObserver(observer,'browser-delayed-startup-finished');
  } catch(error) { dump('[cgl-normal] setup: '+String(error)+'\n'); }
})();
